<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 生图</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f2f5;color:#333;padding:16px;display:flex;justify-content:center}
    .container{max-width:520px;width:100%}
    h1{text-align:center;margin:20px 0;color:#1a1a2e}
    .card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px}
    .card h2{font-size:16px;margin-bottom:12px;color:#555}
    label{display:block;font-size:14px;color:#666;margin:12px 0 6px}
    label:first-child{margin-top:0}
    textarea,select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;outline:none}
    textarea{min-height:80px;resize:vertical}
    .btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;background:#4a6cf7;color:#fff;margin-top:16px}
    .btn:disabled{background:#a0b4f7;cursor:not-allowed}
    .loading{text-align:center;padding:20px;color:#888}
    .spinner{display:inline-block;width:20px;height:20px;border:3px solid #e0e0e0;border-top-color:#4a6cf7;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error{color:#e74c3c;padding:8px;background:#fdf0ef;border-radius:6px}
    .result-box img{width:100%;border-radius:8px;margin-top:12px}
  </style>
</head>
<body>
  <div class="container">
    <h1>AI 生图</h1>
    <div class="card">
      <h2>生成图片</h2>
      <label>描述词</label>
      <textarea id="prompt" placeholder="例如：一只穿西装的猫"></textarea>
      <label>数量</label>
      <select id="count"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
      <label>尺寸</label>
      <select id="size"><option value="1024x1024">1024x1024</option><option value="1792x1024">1792x1024</option><option value="1024x1792">1024x1792</option></select>
      <button class="btn" id="genBtn" onclick="generate()">生成图片</button>
    </div>
    <div class="card" id="resultCard" style="display:none"><h2>结果</h2><div id="result"></div></div>
  </div>
  <script>
    async function generate(){
      const p=document.getElementById('prompt').value.trim();
      if(!p){alert('请输入描述词');return}
      const btn=document.getElementById('genBtn');const r=document.getElementById('result');const rc=document.getElementById('resultCard');
      btn.disabled=true;btn.textContent='生成中...';r.innerHTML='<div class="loading"><span class="spinner"></span>正在生成...</div>';rc.style.display='block';
      try{
        const res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,n:parseInt(document.getElementById('count').value),size:document.getElementById('size').value})});
        const d=await res.json();
        if(!res.ok){r.innerHTML='<div class="error">'+d.error+'</div>';return}
        let html='<div class="result-box">';
        if(d.data&&Array.isArray(d.data))d.data.forEach(item=>{if(item.url)html+='<img src="'+item.url+'" alt="图"/>'});
        html+='</div>';r.innerHTML=html;
      }catch(e){r.innerHTML='<div class="error">失败：'+e.message+'</div>'}
      finally{btn.disabled=false;btn.textContent='生成图片'}
    }
  </script>
</body>
</html>
