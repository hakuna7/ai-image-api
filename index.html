<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Image API</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f7fb;
      color: #181d27;
      display: grid;
      place-items: center;
      padding: 28px;
    }
    main {
      width: min(880px, 100%);
      background: #fff;
      border: 1px solid #d9dee8;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(20, 28, 40, 0.08);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 18px; color: #5b6472; line-height: 1.55; }
    textarea {
      width: 100%;
      min-height: 110px;
      padding: 12px;
      border: 1px solid #c8ced8;
      border-radius: 6px;
      font: inherit;
      resize: vertical;
    }
    .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
    button {
      border: 0;
      background: #0969da;
      color: white;
      border-radius: 6px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { color: #5b6472; }
    #result { margin-top: 20px; }
    img { max-width: 100%; border-radius: 8px; border: 1px solid #d9dee8; display: block; }
    pre { white-space: pre-wrap; background: #f1f3f6; padding: 12px; border-radius: 6px; overflow: auto; }
  </style>
</head>
<body>
  <main>
    <h1>AI Image API</h1>
    <p>输入提示词，页面会调用当前域名下的 <code>/api/generate</code> 接口生成图片。</p>
    <textarea id="prompt">一张未来城市里的可爱机器人，电影感光影，高细节</textarea>
    <div class="row">
      <button id="generate">生成图片</button>
      <span id="status"></span>
    </div>
    <div id="result"></div>
  </main>

  <script>
    const button = document.getElementById('generate');
    const promptInput = document.getElementById('prompt');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');

    button.addEventListener('click', async () => {
      button.disabled = true;
      statusEl.textContent = '正在生成...';
      resultEl.innerHTML = '';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptInput.value.trim() })
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || data.detail?.error?.message || '生成失败');
        }

        const item = data.data?.[0] || data;
        const src = data.image || item.url || (item.b64_json ? `data:image/png;base64,${item.b64_json}` : '');
        if (!src) {
          resultEl.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        } else {
          resultEl.innerHTML = `<img src="${src}" alt="Generated image">`;
        }
        statusEl.textContent = '完成';
      } catch (error) {
        statusEl.textContent = '出错了';
        resultEl.innerHTML = `<pre>${error.message}</pre>`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
